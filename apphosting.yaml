# App Hosting configuration for CartShift Studio
# Docs: https://firebase.google.com/docs/app-hosting

# Cloud Run service settings
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets
env:
  # === Site Configuration ===
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://cartshift-backend--cartshiftstudio.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # === REQUIRED Firebase Configuration ===
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: cartshiftstudio
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_FUNCTION_URL
    value: https://us-central1-cartshiftstudio.cloudfunctions.net/contactForm
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # === OPTIONAL Firebase Configuration ===
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME

  # === Third-party Services ===
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    secret: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    availability:
      - BUILD
      - RUNTIME

