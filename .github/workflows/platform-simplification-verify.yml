name: Platform Simplification Full Verification

# Temporary integration-branch verification. Not intended for main.
on:
  push:
    branches:
      - integration/platform-simplification-2026-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-simplification-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-stub-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-stub.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-stub-project
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
  NEXT_PUBLIC_FIREBASE_FUNCTION_URL: https://us-central1-ci-stub.cloudfunctions.net/contactForm
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate translations
        run: pnpm i18n:merge
      - name: Lint and typecheck
        run: pnpm lint
      - name: Run full test suite
        run: pnpm test:run
      - name: Validate translations
        run: pnpm i18n:validate
      - name: Production build
        run: pnpm build
