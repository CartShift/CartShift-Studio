name: German site integration QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/german-site-integration.yml'
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'i18n/**'
      - 'lib/**'
      - 'messages/src/de/**'
      - 'messages/src/en/**'
      - 'scripts/check-german-parity.cjs'
      - 'scripts/ci/check-german-http.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: german-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-stub-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-stub.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-stub-project
  NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
  NEXT_PUBLIC_FIREBASE_FUNCTION_URL: https://us-central1-ci-stub.cloudfunctions.net/contactForm
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_PUBLIC_GERMAN_MARKETING_ENABLED: 'true'
  NEXT_PUBLIC_GERMAN_TRANSLATIONS_REVIEWED: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  german-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome required for existing CV generator and browser QA
        run: pnpm exec puppeteer browsers install chrome
      - name: Validate complete public German translation
        run: |
          pnpm i18n:merge
          pnpm i18n:de:check
          pnpm i18n:validate
      - name: Verify shared templates, SEO and editorial structure
        run: pnpm exec vitest run tests/i18n/german-content-parity.test.ts tests/i18n/german-layout-parity.test.ts tests/lib/german-routes.test.ts tests/seo/german-metadata.test.ts tests/lib/case-studies-locale.test.ts
      - name: Build German QA site with temporary release flags
        run: pnpm build
      - name: Verify generated routes through Next.js HTTP
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3210 > /tmp/cartshift-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3210/en >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -80 /tmp/cartshift-next.log
            exit 1
          fi
          node scripts/ci/check-german-http.mjs
          node scripts/ci/check-german-browser.mjs
      - name: Explain release restriction
        if: always()
        run: echo 'These test-only toggles do not authorize a public German rollout. Verified Impressum, human translation review and browser QA remain separate release requirements.'
