name: Dashboard Integration Verification
on:
  push:
    branches:
      - integration/dashboard-hardening-20261014

permissions:
  contents: read

concurrency:
  group: dashboard-integration-gate
  cancel-in-progress: true

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-stub-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-stub.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-stub-project
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
  NEXT_PUBLIC_FIREBASE_FUNCTION_URL: https://us-central1-ci-stub.cloudfunctions.net/contactForm
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate translations
        run: |
          pnpm i18n:merge
          pnpm i18n:validate
      - name: Lint and typecheck
        run: pnpm lint
      - name: Complete test suite
        run: pnpm test:run
      - name: Production build
        run: pnpm build

  firestore-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator dependencies
        run: |
          mkdir -p /tmp/cartshift-rules-test
          npm install --prefix /tmp/cartshift-rules-test --no-audit --no-fund --save=false @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
          npm install --global --no-audit --no-fund firebase-tools@14
      - name: Verify Firestore and Storage authorization
        env:
          NODE_PATH: /tmp/cartshift-rules-test/node_modules
        run: firebase emulators:exec --project demo-cartshift --only firestore,storage -- "node tests/firestore/project-rules.cjs"
