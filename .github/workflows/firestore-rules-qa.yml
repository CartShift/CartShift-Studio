name: Firestore & Storage Rules QA

on:
  # Automated by the unified CI quality gate; retain a manual standalone run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test dependencies
        run: |
          mkdir -p /tmp/cartshift-rules-test
          npm install --prefix /tmp/cartshift-rules-test --no-audit --no-fund --save=false @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
          npm install --global --no-audit --no-fund firebase-tools@14
      - name: Validate rules and exercise tenant boundaries
        env:
          NODE_PATH: /tmp/cartshift-rules-test/node_modules
        run: firebase emulators:exec --project demo-cartshift --only firestore,storage -- "node tests/firestore/project-rules.cjs && node tests/storage/tenant-rules.cjs"
