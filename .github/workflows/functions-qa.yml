name: Firebase Functions QA

on:
  # Automated by the unified CI quality gate; retain a manual standalone run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-qa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: functions/pnpm-lock.yaml
      - name: Install frozen Functions dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint Firebase Functions entrypoint
        # Functions still uses ESLint 8 + legacy .eslintrc.json.
        # Explicitly select legacy config and lint JS; TypeScript is checked by tsc.
        run: ESLINT_USE_FLAT_CONFIG=false pnpm exec eslint index.js runtime/email-queue.js analyzer/report-retry.js rate-limit.js
      - name: Compile Firebase Functions TypeScript
        run: pnpm build
      - name: Test durable email queue transitions
        run: node --test runtime/*.test.js
      - name: Test distributed limits and analyzer retry claims
        run: node --test ../tests/functions/*.test.cjs
