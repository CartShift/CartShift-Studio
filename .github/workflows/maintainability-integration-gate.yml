name: CartShift Integration Full Verification
on:
  push:
    branches:
      - integration/cartshift-maintainability-20261014

permissions:
  contents: read

concurrency:
  group: cartshift-maintainability-integration
  cancel-in-progress: true

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-stub-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-stub.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-stub-project
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
  NEXT_PUBLIC_FIREBASE_FUNCTION_URL: https://us-central1-ci-stub.cloudfunctions.net/contactForm
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  full-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Merge and validate translations
        run: |
          pnpm i18n:merge
          pnpm i18n:validate
      - name: Full lint and TypeScript
        run: pnpm lint
      - name: All Vitest tests
        run: pnpm test:run
      - name: Next.js production build
        run: pnpm build
